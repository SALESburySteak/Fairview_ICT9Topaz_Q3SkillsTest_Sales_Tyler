<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 Skills Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            margin: 0;
            background-color: #bfc2c5;
        }

        .navbar {
            background-color: #1519f3;
            color: rgb(255, 255, 255);
            padding: 11px 23px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            
        }

        .navleft {
            font-size: 20px;
            font-weight: bold;
        }

        .navlinks a {
            color: rgb(255, 255, 255);
            margin-right: 15px;
            font-weight: bold;
            font-size: 11px;
        }

        .Rform {
            width: 823px;
            margin: 55px auto;
            background: white;
            padding: 23px;
            border-radius: 15px;
            border: 10px solid #1519f3;
        }
        
        .Pfp {
            text-align: center;
        }

        #pfpInput {
            align-self: center;
        }

        #pfpPreview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid black;
            object-fit: cover;
            justify-content: center;
            align-items: center;
        }


        label {
            font-weight: bold;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        button {
            background-color: #3852ff;
            color: white;
        }

        h3 {
            margin-top: 30px;
        }

    </style>

</head>
<body>
    
    <div class="navbar">
    <div class="navleft">NC SWIFTFARE</div>

    <div class="navlinks">
        <a href="#">Home</a>
        <a href="#">Fare Matrix</a>
        <a href="#">Schedule</a>
        <a href="#">Bookings</a>
        <a href="#">Help</a>
        <a href="#">Account</a>
    </div>
</div>

<div class="Rform">

    <h2 style="color: #000000; text-align: center;">REGISTRATION</h2>
    <p style="color: #000000; text-align: center;">Fill up the necessary requirements and click create to register your account.</p>

<br><br>

    <form id="Form">
        <div class="row">
            <div class="col">
                <div class="Pfp">
                <img id="pfpPreview" src="https://via.placeholder.com/120">
                <br><br>
                <input type="file" id="pfpInput" accept="image/*">
                    <div class="container">
                        <button type="button" onclick="document.getElementById('pfpInput').click()">
                            Upload PFP
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <br><br>
        <div class="row">
            <div class="col">
                <label for="fname" class="form-label"><b>First name</b></label>
                <br>
                <input type="text" name="fname" class="form-control" placeholder="Juan" required>
            </div>

            <div class="col">
                <label for="lname" class="form-label"><b>Last name</b></label>
                <br>
                <input type="text" name="lname" class="form-control" placeholder="Dela Cruz" required>
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col">
                <label for="Age" class="form-label"><b>Age</b></label>
                <br>
                <input type="number" name="Age" class="form-control" placeholder="18" required>
            </div>

            <div class="col">
                <label for="ContactNumber" class="form-label"><b>Contact Number</b></label>
                <br>
                <input type="number" name="ContactNumber" class="form-control" placeholder="XXXX-XXX-XXX" required>
            </div>
        </div>
                
        <br>
        <div class="row">
          <div class="col">
                <label for="Email" class="form-label"><b>Email Address</b></label>
                <br>
                <input type="text" name="Email" class="form-control" placeholder="juandelacruz@gmail.com" required>
            </div>
        </div>
        <br>
        <div class="row">
          <div class="col">
                <label for="Username" class="form-label"><b>Username</b></label>
                <br>
                <input type="text" name="Username" id="username" class="form-control" placeholder="nc4tz" required>
            </div>
        </div>
        <br>
        <div class="row">
          <div class="col">
                <label for="Passowrd" class="form-label"><b>Password</b></label>
                <br>
                <input type="password" name="Password" id="password" class="form-control" placeholder="Make your password as strong as possible" required>
            </div>
        </div>
        <br>
        <div class="row">
          <div class="col">
              <button type="button" class="btn btn-primary" onclick="register()">Create Account</button>
            </div>
        </div>
        <div class="row">
          <div class="col">
              <button type="button" class="btn btn-secondary" onclick="cancelForm()">Cancel</button>
            </div>
        </div>
    </div>
    </form>
</div>

<script>
const defaultPFP = "https://via.placeholder.com/120";

// Preview selected image
document.getElementById("pfpInput").addEventListener("change", function(event) {
    const file = event.target.files[0];

    if (file) {
        const imageURL = URL.createObjectURL(file);
        document.getElementById("pfpPreview").src = imageURL;

        // Alert notification
        alert("Profile picture uploaded successfully!");
    }
});

function register() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (!username || !password) {
        alert("Incomplete requirements. Please fill out necessary fields.");
        return;
    }

    if (document.getElementById("pfpInput").files.length === 0) {
        alert("Please upload a profile picture!");
        return;
    }

    alert("Account created successfully!");
}

function cancelForm() {
    if (confirm("Are you sure you want to cancel?")) {
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        document.getElementById("pfpInput").value = "";
        document.getElementById("pfpPreview").src = "https://via.placeholder.com/120";

        alert("Form has been cleared.");
    }
}
</script>

</body>

</html>
